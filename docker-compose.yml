version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: health-story-db
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: health_story_dev
    ports:
      - "5432:5432"
    volumes:
      # Persist database data between container restarts
      - postgres_data:/var/lib/postgresql/data
      # Run SQL migrations on startup
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d health_story_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - health-story-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  health-story-network:
    driver: bridge
